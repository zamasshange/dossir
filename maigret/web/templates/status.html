{% extends "base.html" %}
{% block title %}Search running — Maigret{% endblock %}

{% block content %}
<section class="waiting">
    <div>
        <p class="eyebrow" style="justify-content: center;"><span>Still working</span></p>
        <h1>Checking sites<br><em>in the background.</em></h1>
        <p>This page will open the profiles as soon as the lookup finishes.</p>
        <div class="pulse" role="status" aria-label="Search in progress"></div>
    </div>
</section>
<script>
    setTimeout(function () {
        window.location.reload();
    }, 5000);
</script>
{% endblock %}
